 var l=all().filter(function(s){return s.t==type&&!ST.bk[s.n]&&ready(s)&&(!WD||s.dr)&&s.n!=ex});
 l.forEach(function(s){s.sc=(s.c==city?2:0)+(ready(s)?1:0)+rate(s)/5+(ST.fav[s.n]?1.5:0)+(note&&s.m&&s.m.indexOf(note)>=0?3:0)});
 l.sort(function(a,b){return b.sc-a.sc});
 return l.slice(0,3).map(function(s){return{n:s.n,c:s.c,k:ready(s),r:rate(s),unit:s.p,f:!!ST.fav[s.n],tot:Math.round(s.p*qty*days*(urg?1.2:1)/1000)*1000}})}
var NAV=["لوحة","طلب","طلباتي","الموارد","سجّل","حسابي","دردشة","وظائف","خطة التطوير"];

function dash(){
 var tl=0,fl=0,val=0,pend=0,paid=0;

 var rd=all().filter(ready).length;
 return'<div class="g"><div class="k"><b>'+ST.R.length+'</b>طلبات ومشاريع</div><div class="k"><b>'+fl+' / '+tl+'</b>بنود مغطاة</div><div class="k"><b>'+fmt(val)+'</b>قيمة العروض المقبولة</div><div class="k"><b>'+rd+' / '+all().length+'</b>موردون جاهزون للتعبئة</div><div class="k"><b>'+fmt(pend)+'</b>مستحقات قيد الدفع</div><div class="k"><b>'+fmt(paid)+'</b>مدفوع</div></div>'
 +'<div class="c" style="margin-top:10px"><b>كيف تعمل المنصة؟</b><div class="mu">انشر طلباً (أو مشروعاً بعدة موارد) ← استقبل عروضاً مرتبة بالقرب والتوثيق والتقييم ← اقبل العرض ← تواصل مع المورد ← قيّم بعد الإنجاز.</div></div>'
 +'<button class="ac" onclick="if(confirm(\'مسح كل البيانات التجريبية؟\')){ST={R:[],X:[],bk:{},rt:{},fav:{},dd:{},ch:{},U:ST.U,S:ST.S,lang:ST.lang};save();go(0)}">إعادة ضبط النموذج</button>'}
function roadmap(){
 return '<div class="c"><div class="row"><b style="font-size:19px">خارطة تطوير LogiLink DZ</b><span class="tag">خطة عمل</span></div><p class="mu">هذه الصفحة تجمع الملاحظات والتوصيات لتحويل النموذج التجريبي إلى منصة لوجستية قابلة للاستخدام التجاري. وجود هذه الخطة داخل النموذج لا يعني أن الوظائف الخلفية قد نُفذت.</p><div class="g"><div class="k"><b>9/10</b>قوة الفكرة</div><div class="k"><b>8/10</b>واجهة وتجربة الاستخدام</div><div class="k"><b>2/10</b>جاهزية البيانات الحقيقية</div><div class="k"><b>3/10</b>الجاهزية التجارية والتقنية</div></div></div>'+
 '<div class="c"><b>1. أهم فجوة: قاعدة بيانات وخادم حقيقي</b><ul><li>نقل الحسابات والطلبات والعروض والمحادثات والتقييمات من localStorage إلى قاعدة بيانات مركزية.</li><li>إنشاء واجهة خلفية (Backend/API) مع صلاحيات على مستوى كل دور وحساب.</li><li>اعتماد تسجيل دخول آمن، وإعادة تعيين كلمة المرور، والتحقق من البريد أو الهاتف، وإدارة الجلسات.</li><li>منع المستخدم من مشاهدة أو تعديل طلبات وعروض ووثائق لا تخصه.</li><li>إضافة نسخ احتياطي، وسجل تدقيق للعمليات، ومراقبة الأخطاء، وسياسة خصوصية وشروط استخدام.</li></ul><div class="mu">اقتراح تقني مبدئي: Supabase أو خادم موثوق مماثل، بعد تحديد متطلبات الاستضافة وحماية البيانات. لا تُدخل بيانات حقيقية أو حساسة في النسخة الحالية.</div></div>'+
 '<div class="c"><b>2. التحقق من الموردين والوثائق</b><ul><li>إنشاء ملف موثّق للمؤسسة أو المورد يتضمن بيانات التسجيل والنشاط ووسائل الاتصال.</li><li>إرفاق بطاقة الترقيم، والتأمين، والفحص التقني، ورخصة النقل أو النشاط عند انطباقها.</li><li>تسجيل تاريخ انتهاء كل وثيقة وإرسال تنبيهات قبل انتهائها، وإيقاف علامة «موثّق/جاهز» عند انتهاء وثيقة إلزامية.</li><li>إضافة مراجعة إدارية يدوية للوثائق قبل منح شارة التوثيق.</li><li>توضيح أن رفع الملف وحده لا يعني أنه تم التحقق منه قانونياً.</li></ul></div>'+
 '<div class="c"><b>3. دورة طلب وعرض واضحة</b><ul><li>تحديد حالة الطلب: مسودة، منشور، عروض مستلمة، عرض مقبول، قيد التنفيذ، مكتمل، ملغى أو محل نزاع.</li><li>إظهار السعر والوحدة والمدة وما يشمله السعر: الوقود، السائق، النقل إلى الموقع، الضرائب، ورسوم التعبئة أو الإلغاء.</li><li>تمكين طالب الخدمة من مقارنة العروض حسب السعر والتوفر والمسافة والتوثيق والتقييم، مع توضيح طريقة الترتيب.</li><li>إنشاء أمر خدمة أو عقد مبسط يتضمن نطاق الخدمة والموقع والتواريخ والسعر ومسؤوليات الطرفين.</li><li>إضافة تأكيد بدء الخدمة وإتمامها، ومحضر استلام، وسجل تغييرات، وإمكانية طباعة أمر الخدمة أو تصديره PDF.</li><li>دعم التفاوض وتعديل العرض وقبوله أو رفضه مع الاحتفاظ بتاريخ المراسلات.</li></ul></div>'+
 '<div class="c"><b>4. الدفع والعمولة ونموذج الإيرادات</b><ul><li>اختيار نموذج تجاري واضح: عمولة على الخدمة المنجزة، أو اشتراك للموردين، أو رسوم على العملاء، أو نموذج مختلط.</li><li>عرض الرسوم والعمولات وشروط الاسترداد والإلغاء قبل تأكيد الحجز.</li><li>إضافة حالات مالية منفصلة: غير مستحق، مستحق، قيد الدفع، مدفوع، مسترد أو محل نزاع.</li><li>عدم الادعاء بأن الدفع الإلكتروني أو الضمان المالي متاح قبل دمج مزود دفع مرخص والتحقق من المتطلبات القانونية في الجزائر.</li><li>في المرحلة التجريبية يمكن توثيق الدفع خارج المنصة مع إيصال وحالة يحدّثها الطرفان، دون تخزين بيانات البطاقات.</li></ul></div>'+
 '<div class="c"><b>5. الثقة والتقييم وحل النزاعات</b><ul><li>السماح بالتقييم بعد إتمام خدمة مؤكدة فقط، وليس من أي حساب عشوائي.</li><li>فصل تقييم السعر والالتزام بالوقت وحالة المعدات والسلامة والتواصل.</li><li>إضافة الإبلاغ عن عرض مشبوه، وحظر الحساب، ومراجعة الشكاوى من مسؤول المنصة.</li><li>إنشاء مسار نزاع يطلب الأدلة من الطرفين ويسجل القرار والتاريخ.</li><li>إظهار تقييمات موثقة وعدد الخدمات المنجزة، وعدم عرض بيانات تجريبية على أنها سمعة حقيقية.</li></ul></div>'+
 '<div class="c"><b>6. الإشعارات والمحادثات</b><ul><li>إشعار طالب الخدمة عند وصول عرض أو تغيير حالته، وإشعار المورد عند وجود طلب مناسب أو قرب موعد التعبئة.</li><li>تنبيهات داخل التطبيق، ثم البريد أو SMS أو WhatsApp عبر تكامل رسمي وبموافقة المستخدم.</li><li>حفظ الرسائل في قاعدة البيانات مع الطوابع الزمنية وربطها بالطلب، مع أدوات للإبلاغ عن إساءة الاستخدام.</li><li>إظهار حالة الإشعار وعدم الاعتماد على زر يفتح WhatsApp وحده كأنه نظام إشعارات متكامل.</li></ul></div>'+
 '<div class="c"><b>7. تحسين البحث وإدارة الأسطول</b><ul><li>بحث وفلاتر حسب الولاية والبلدية والمسافة ونوع الآلية والسعة والتوفر وتاريخ التعبئة.</li><li>ملفات تفصيلية للمعدات: النوع، الماركة، السعة، سنة الصنع، حالة الصيانة، الموقع، الصور والوثائق.</li><li>تقويم للحجوزات لمنع قبول طلبين متعارضين للمعدة نفسها.</li><li>إدارة الصيانة والتوقفات وتواريخ انتهاء الوثائق والتأمين والفحص التقني.</li><li>إظهار وقت الوصول المتوقع وتكلفة نقل المعدة إلى الموقع عندما تتوفر بيانات موثوقة.</li></ul></div>'+
 '<div class="c"><b>8. تطوير قسم الوظائف</b><ul><li>فصل حساب الباحث عن العمل عن حساب الشركة، مع صلاحيات مناسبة لكل منهما.</li><li>إضافة السيرة الذاتية والخبرات والشهادات والتخصص ومكان الإقامة والتوفر، مع التحكم في خصوصية البيانات.</li><li>تمكين الشركات من نشر الوظائف وفرز الطلبات وتغيير حالة الترشح وإرسال ردود للمتقدمين.</li><li>إضافة الإبلاغ عن الوظائف الوهمية والتحقق من الشركات، وعدم إظهار معلومات الاتصال الخاصة دون موافقة.</li></ul></div>'+
 '<div class="c"><b>9. خطة إطلاق عملية مقترحة</b><ol><li><b>المرحلة الأولى – اختبار السوق:</b> البدء في محور حاسي مسعود–ورقلة–الوادي، وإجراء مقابلات مع شركات طالبة للخدمة ومورّدين فعليين.</li><li><b>المرحلة الثانية – تجربة محدودة:</b> استقطاب 15–30 مورداً حقيقياً والتحقق من وثائقهم، مع عدد محدود من الشركات وطلبات حقيقية تتم متابعتها يدوياً.</li><li><b>المرحلة الثالثة – النسخة التشغيلية:</b> بناء قاعدة البيانات وتسجيل الدخول والصلاحيات وسير الطلبات والعروض والوثائق والإشعارات.</li><li><b>المرحلة الرابعة – المعاملات:</b> أوامر الخدمة والعقود والتقييمات بعد الإنجاز وحل النزاعات ونموذج العمولة أو الاشتراك.</li><li><b>المرحلة الخامسة – التوسع:</b> إضافة ولايات وفئات معدات جديدة بناءً على الطلب الفعلي وقياس جودة الخدمة.</li></ol></div>'+
 '<div class="c"><b>10. مؤشرات يجب قياسها</b><ul><li>عدد الموردين الموثقين والنشطين، لا مجرد عدد الحسابات.</li><li>متوسط الوقت للحصول على أول عرض، ونسبة الطلبات التي تحصل على عرض.</li><li>نسبة العروض المقبولة والخدمات المنجزة والطلبات الملغاة.</li><li>نسبة الالتزام بالموعد، والشكاوى، وحالات انتهاء الوثائق.</li><li>متوسط قيمة الخدمة، وتكلفة اكتساب العميل، والإيراد الصافي للمنصة.</li></ul></div>'+
 '<div class="c"><b>11. ملاحظات مهمة على النسخة الحالية</b><ul><li>أسماء الموردين والأسعار والتقييمات المعروضة حالياً تجريبية وليست عروضاً حقيقية.</li><li>تخزين البيانات في المتصفح يعني أنها قد تختفي عند مسح بيانات المتصفح، ولا تتم مزامنتها بين الأجهزة أو المستخدمين.</li><li>الحسابات المخزنة محلياً ليست نظام مصادقة آمناً، ولا تصلح لحماية معلومات تجارية أو شخصية حقيقية.</li><li>قبول عرض أو تغيير تقييم في النموذج لا يثبت وجود عقد أو عملية دفع فعلية.</li><li>هذه الصفحة توثق المتطلبات والتوصيات؛ تنفيذ قاعدة بيانات وخادم آمن وإشعارات ودفع حقيقي يحتاج تطويراً واختبارات مستقلة.</li></ul></div>'+
 '<div class="c"><b>التوصية النهائية</b><p>الأفضل أن تنطلق LogiLink DZ كمنصة وسيطة متخصصة تربط الشركات التي لديها احتياج لوجستي بالموردين الذين يملكون الشاحنات والمعدات والخدمات. ابدأ بفئات محددة ومنطقة جغرافية محددة، وركّز على التحقق من الموردين وجودة تنفيذ الطلب قبل التوسع. ويمكن أن تتطور لاحقاً إلى نموذج هجين يجمع بين المنصة الرقمية وخدمة تنسيق لوجستي بشرية.</p></div>';

function reqs0(){
 if(!ST.R.length)return'<div class="c empty">لا توجد طلبات بعد. انشر طلبك الأول من تبويب «طلب».</div>';
 return ST.R.map(function(r,ri){
  var f=r.lines.filter(function(l){return l.acc>=0}).length,tot=r.lines.length,
  txt='طلب عبر LogiLink DZ: '+r.lines.map(function(l){return l.qty+' × '+l.type}).join("، ")+' – '+r.days+' أيام – '+r.city;
  return'<div class="c" style="border-color:var(--pr)"><div class="row"><b>'+(tot>1?'مشروع':'طلب')+' – '+esc(r.city)+' – '+r.days+' أيام</b>'+(r.by?'<span class="tag">من: '+esc(r.by)+'</span>':'')+(r.urg?'<span class="tag wn">عاجل</span>':'')+'</div>'
  +'<div class="mu">تمت تغطية '+f+' من '+tot+' بنود</div><div class="bar"><i style="width:'+(f/tot*100)+'%"></i></div>'
  +r.lines.map(function(l,li){
   var mn=Math.min.apply(0,l.off.map(function(x){return x.tot})),bi=best(l,r.city,mn);
